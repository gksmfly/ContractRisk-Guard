# pyproject.toml
# Ruff 설정 전용. 빌드 백엔드·패키지 메타데이터는 넣지 않는다 — 이 저장소는 배포되는
# 라이브러리가 아니라 `python -m backend.*`로 실행하는 파이프라인이다.
#
# pytest 설정은 `pytest.ini`에 그대로 둔다. 여기로 옮기면 이번 커밋이
# "린터 도입"이 아니라 "설정 대이동"이 되고, 깨졌을 때 원인이 안 보인다.

[tool.ruff]
# 실제 .venv가 3.10.14다. `Claude.md`는 "Python 3.11+"라고 적고 있으나 환경이
# 아직 3.10이므로 **환경 쪽에 맞춘다** — 규칙에 맞춰 py311로 적으면 3.10에 없는
# 문법을 권하는 수정이 나올 수 있다. 인터프리터를 올릴 때 이 값도 같이 올릴 것.
target-version = "py310"
line-length = 120          # E501은 아래에서 선택하지 않으므로 참고값일 뿐이다
extend-exclude = [".venv", "data", "models", "frontend"]

[tool.ruff.lint]
# ── 왜 이 둘만 켜는가 ────────────────────────────────────────────────────
#
# 전체 규칙으로 돌리면 169건이 나오는데, 그중 다수가 **이 프로젝트의 명시적 정책과
# 충돌한다.** 규칙이 정책과 싸우면 규칙을 끈다.
#
#   F  버그류(undefined-name, unused-import, 무의미한 f-string 등)
#      → 도입 근거 그 자체다. F821이 `eval/smoke_check.py`의 실제 NameError를 잡아냈다.
#        그것도 게이트를 **통과**했을 때만 터지는 자리라 실행 로그로는 안 보였다.
#   I  import 순서
#      → `Claude.md`의 "import 순서: 표준 → 서드파티 → 내부"가 이미 규칙으로 적혀 있다.
#        도구가 없어서 62개 파일이 조용히 어긋나 있었을 뿐이다.
#
# 일부러 뺀 것:
#
#   BLE001 (blind-except, 40건)
#      `Claude.md`의 "모든 API 호출은 try-except로 감싸기"가 명시된 정책이다.
#      OpenAI 왕복·DB·모델 로드의 `except Exception`은 위반이 아니라 그 정책의 이행이다.
#   E501 (line-too-long)
#      주석이 장식이 아니라 측정 근거·정정 이력이 담긴 본문이라 폭을 강제하지 않는다.
select = ["F", "I"]

[tool.ruff.lint.isort]
# `backend`를 1st-party로 못박아야 "표준 → 서드파티 → 내부" 3단 정렬이 나온다.
# 이게 없으면 ruff가 `backend`를 서드파티로 오인해 내부 import가 위로 섞여 올라간다.
known-first-party = ["backend"]

[tool.ruff.format]
# ── Black·ruff format 둘 다 쓰지 않는다 (2026-09-01 측정 후 결정) ──────────
#
# 실측: Black 기본 설정으로 **127개 중 110개 파일 재포맷 / +5,742 −2,288줄**.
# 줄 길이를 120까지 늘려도 102개라 거의 안 줄어든다 — 구조 자체가 Black 스타일이 아니다.
#
# 두 가지를 잃는데, 둘 다 이 저장소에서 값이 크다:
#
#   1. 정렬된 한글 주석이 무너진다 (한글 포함 줄 −883 / +1,037)
#          -    clause: str            # 그래프 시작 시 필수로 채워짐 …
#          +    clause: str  # 그래프 시작 시 필수로 채워짐 …
#      심한 경우 주석이 `]` 줄로 올라가 **어느 필드 설명인지 알 수 없게 된다.**
#      여기서 주석은 장식이 아니라 "왜 이 값인지"의 유일한 기록이다.
#   2. 코드베이스 전역의 `git blame`이 그 한 커밋으로 덮인다.
#      `_FINAL_K`가 왜 5인지, 상한이 왜 20에서 60이 됐는지 — 전부 blame으로 추적한 것들이다.
#      `.git-blame-ignore-revs`로 완화는 되지만 1번은 되돌아오지 않는다.
#
# 포맷을 통일하고 싶어지면 **새 파일에만** 적용하는 쪽을 먼저 검토할 것.
exclude = ["*"]
