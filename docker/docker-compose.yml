services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contractrisk-guard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractrisk-guard-db
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: contractrisk-guard-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
